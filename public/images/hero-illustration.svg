<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="440" height="320" rx="16" fill="#FFFFFF" />
  <rect x="20" y="20" width="440" height="320" rx="16" fill="none" stroke="#DCE9FF" stroke-width="2" />

  <!-- Bar chart -->
  <rect x="60" y="220" width="36" height="80" rx="4" fill="#D3E4FE" />
  <rect x="112" y="180" width="36" height="120" rx="4" fill="#8293B8" />
  <rect x="164" y="140" width="36" height="160" rx="4" fill="#1A2B4B" />
  <rect x="216" y="200" width="36" height="100" rx="4" fill="#D3E4FE" />

  <!-- Line trend -->
  <polyline points="280,260 320,210 360,230 400,160 420,180"
    fill="none" stroke="#516161" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="280" cy="260" r="5" fill="#516161" />
  <circle cx="320" cy="210" r="5" fill="#516161" />
  <circle cx="360" cy="230" r="5" fill="#516161" />
  <circle cx="400" cy="160" r="5" fill="#516161" />
  <circle cx="420" cy="180" r="5" fill="#516161" />

  <!-- Data node dots -->
  <circle cx="70" cy="70" r="10" fill="#1A2B4B" />
  <circle cx="110" cy="70" r="6" fill="#8293B8" />
  <circle cx="150" cy="70" r="6" fill="#D3E4FE" />

  <!-- Connector lines top -->
  <line x1="80" y1="70" x2="104" y2="70" stroke="#C5C6CF" stroke-width="2" />
  <line x1="116" y1="70" x2="144" y2="70" stroke="#C5C6CF" stroke-width="2" />

  <!-- Small panel -->
  <rect x="330" y="50" width="100" height="70" rx="8" fill="#E5EEFF" />
  <rect x="342" y="64" width="60" height="8" rx="4" fill="#8293B8" />
  <rect x="342" y="80" width="76" height="8" rx="4" fill="#D3E4FE" />
  <rect x="342" y="96" width="40" height="8" rx="4" fill="#D3E4FE" />
</svg>
